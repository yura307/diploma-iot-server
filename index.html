<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моніторинг рівня шуму та вібрацій</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="#"><i class="fa-solid fa-microchip me-2"></i>SmartMonitor</a>
        <span class="navbar-text text-light">
            <i class="fa-solid fa-circle text-success me-1" id="connectionStatus"></i> Онлайн
        </span>
    </div>
</nav>

<div class="container-fluid px-4">
    <div class="row">
        <div class="col-xl-4 col-md-6">
            <div class="card bg-white">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-muted text-uppercase mb-2">Рівень шуму</h6>
                        <h2 class="mb-0 fw-bold"><span id="noiseValue">0</span> <small class="text-muted fs-6">дБ</small></h2>
                        <div class="mt-2" id="noiseStatus">
                            <span class="badge bg-success status-badge">В нормі</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-volume-high stat-icon text-primary"></i>
                </div>
            </div>
        </div>

        <div class="col-xl-4 col-md-6">
            <div class="card bg-white">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-muted text-uppercase mb-2">Рівень вібрації</h6>
                        <h2 class="mb-0 fw-bold"><span id="vibroValue">0</span> <small class="text-muted fs-6">mm/s</small></h2>
                        <div class="mt-2" id="vibroStatus">
                            <span class="badge bg-success status-badge">В нормі</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-wave-square stat-icon text-warning"></i>
                </div>
            </div>
        </div>

        <div class="col-xl-4 col-md-12">
            <div class="card bg-white">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-muted text-uppercase mb-2">Оцінка системи</h6>
                        <h4 class="mb-0 text-success fw-bold" id="systemState">Стабільний стан</h4>
                        <small class="text-muted">Аналіз аномалій активний</small>
                    </div>
                    <i class="fa-solid fa-shield-check stat-icon text-success" id="systemIcon"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header bg-white fw-bold">
                    <i class="fa-solid fa-chart-line me-1"></i> Динаміка акустичного фону
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="noiseChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card">
                <div class="card-header bg-white fw-bold">
                    <i class="fa-solid fa-chart-area me-1"></i> Динаміка вібрацій
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="vibroChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header bg-white fw-bold d-flex justify-content-between align-items-center">
                    <span><i class="fa-solid fa-list me-1"></i> Інтелектуальний журнал аномалій</span>
                    <button class="btn btn-sm btn-outline-secondary" onclick="document.getElementById('logBody').innerHTML=''">Очистити</button>
                </div>
                <div class="card-body p-0 log-table-container">
                    <table class="table table-hover table-striped mb-0">
                        <thead class="table-light sticky-top">
                            <tr>
                                <th>Час</th>
                                <th>Подія</th>
                                <th>Значення</th>
                                <th>Рівень загрози</th>
                            </tr>
                        </thead>
                        <tbody id="logBody">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="script.js"></script>
</body>
</html>
